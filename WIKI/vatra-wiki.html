<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VATRA WIKI</title>
<style>
:root{
  --bg:#0b0b0e;--sidebar-bg:#0f0f14;--panel:#14141a;--border:#22222e;
  --accent:#c8833a;--accent2:#7a4fc4;--accent3:#4a90d4;--text:#e2d8cc;
  --muted:#5a5568;--muted2:#7a7490;--danger:#9b2f2f;--safe:#3a7a3a;
  --glow:rgba(200,131,58,.12);--glow2:rgba(122,79,196,.1);
  --sidebar-w:260px;--topbar-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* TOPBAR */
.topbar{height:var(--topbar-h);background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;z-index:100}
.logo{font-size:1.1rem;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;font-weight:bold;white-space:nowrap}
.logo span{color:var(--muted2);font-size:.7rem;letter-spacing:.15em;margin-left:8px}
.search-wrap{flex:1;max-width:420px;position:relative}
.search-input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 14px 7px 34px;border-radius:4px;font-family:inherit;font-size:.82rem;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge-pill{background:var(--panel);border:1px solid var(--border);color:var(--muted2);font-size:.68rem;padding:3px 10px;border-radius:12px;letter-spacing:.08em}

/* SEARCH RESULTS */
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;z-index:200;max-height:360px;overflow-y:auto;display:none}
.search-results.open{display:block}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--glow)}
.sr-item .sr-title{font-size:.85rem;color:var(--text)}
.sr-item .sr-section{font-size:.7rem;color:var(--muted2);margin-top:2px;letter-spacing:.08em;text-transform:uppercase}

/* LAYOUT */
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:12px 0 20px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.nav-section{margin-bottom:4px}
.nav-section-header{padding:8px 16px 4px;font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.nav-section-header:hover{color:var(--muted2)}
.nav-section-header .toggle{transition:transform .2s;font-size:.7rem}
.nav-section-header.collapsed .toggle{transform:rotate(-90deg)}
.nav-items{overflow:hidden}
.nav-items.hidden{display:none}
.nav-item{display:block;padding:6px 16px 6px 20px;font-size:.8rem;color:var(--muted2);cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--accent);background:var(--glow);border-left-color:var(--accent)}
.nav-item.sub{padding-left:32px;font-size:.75rem}
.nav-divider{height:1px;background:var(--border);margin:8px 12px}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:32px 40px;max-width:1100px}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* PAGE ELEMENTS */
.page-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.page-header h1{font-size:1.8rem;letter-spacing:.05em;margin-bottom:6px}
.page-header .page-meta{color:var(--muted2);font-size:.78rem;letter-spacing:.1em}
.page-header .page-tag{display:inline-block;font-size:.65rem;padding:2px 10px;border-radius:12px;margin-right:6px;border:1px solid}
.tag-world{color:#7ec87e;border-color:rgba(126,200,126,.3);background:rgba(126,200,126,.08)}
.tag-char{color:#7ab4f0;border-color:rgba(122,180,240,.3);background:rgba(122,180,240,.08)}
.tag-secret{color:#d07070;border-color:rgba(208,112,112,.3);background:rgba(208,112,112,.08)}
.tag-magic{color:#b07ee0;border-color:rgba(176,126,224,.3);background:rgba(176,126,224,.08)}
.tag-faction{color:#d4b84a;border-color:rgba(212,184,74,.3);background:rgba(212,184,74,.08)}
.tag-artifact{color:var(--accent);border-color:rgba(200,131,58,.3);background:rgba(200,131,58,.08)}

.section-title{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
.card h3{font-size:.9rem;margin-bottom:4px}
.card .card-sub{font-size:.72rem;color:var(--muted2);margin-bottom:8px;letter-spacing:.06em}
.card p{font-size:.78rem;color:var(--muted2);line-height:1.5}
.card .card-tag{position:absolute;top:12px;right:12px;font-size:.62rem;padding:1px 7px;border-radius:10px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.info-block{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px}
.info-block h3{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.info-block p,.info-block li{font-size:.82rem;line-height:1.6;color:var(--text)}
.info-block li{margin-left:16px;margin-bottom:4px}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--muted2)}
.stat-value{color:var(--text);font-weight:bold}
.stat-value.danger{color:#d07070}
.stat-value.safe{color:#7ec87e}
.stat-value.accent{color:var(--accent)}

.quote-block{background:var(--glow2);border:1px solid rgba(122,79,196,.2);border-left:3px solid var(--accent2);border-radius:6px;padding:16px 20px;margin:16px 0;font-style:italic;font-size:.88rem;line-height:1.7;color:var(--text)}

.danger-block{background:rgba(155,47,47,.08);border:1px solid rgba(155,47,47,.25);border-radius:6px;padding:14px;margin:12px 0;font-size:.82rem;line-height:1.6}
.danger-block .danger-label{color:#d07070;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}

.secret-block{background:rgba(122,79,196,.06);border:1px solid rgba(122,79,196,.2);border-radius:6px;padding:14px;margin:12px 0;font-size:.82rem;line-height:1.6}
.secret-block .secret-label{color:var(--accent2);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}

.reveal-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;font-size:.72rem;border-radius:3px;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:6px}
.reveal-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.hidden-content{display:none;margin-top:10px}

table{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:.8rem}
th{text-align:left;padding:8px 12px;background:var(--panel);color:var(--muted2);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid rgba(34,34,46,.6);vertical-align:top;line-height:1.5}
tr:hover td{background:rgba(255,255,255,.02)}
td a{cursor:pointer}

.char-header{display:flex;gap:24px;margin-bottom:24px;align-items:flex-start}
.char-avatar{width:100px;height:120px;background:var(--panel);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0}
.char-info h1{font-size:1.5rem;margin-bottom:4px}
.char-info .char-title{color:var(--accent);font-size:.85rem;letter-spacing:.1em;margin-bottom:8px}
.char-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.char-tags .tag{font-size:.65rem;padding:2px 10px;border-radius:10px;border:1px solid}

.seal-badge{display:inline-flex;align-items:center;gap:6px;background:var(--glow2);border:1px solid rgba(122,79,196,.3);border-radius:4px;padding:4px 12px;font-size:.75rem;color:var(--accent2);margin-top:8px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;cursor:pointer;font-size:.78rem;color:var(--muted2);border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}

.spell-table td:first-child{color:var(--accent);font-size:.78rem;width:200px}
.spell-table td:nth-child(2){color:var(--muted2);font-size:.7rem;width:80px}
.spell-table td.forbidden-spell{color:#d07070}

.relation-grid{display:flex;flex-direction:column;gap:8px}
.relation-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px 14px;cursor:pointer;transition:all .2s}
.relation-item:hover{border-color:var(--accent)}
.relation-icon{font-size:1.2rem;width:32px;text-align:center}
.relation-name{font-size:.85rem;color:var(--text)}
.relation-type{font-size:.72rem;color:var(--muted2)}
.relation-desc{font-size:.75rem;color:var(--muted2);margin-top:2px}

.faction-bar{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s}
.faction-bar:hover{border-color:var(--accent)}
.faction-bar .f-name{font-size:.88rem;min-width:200px}
.faction-bar .f-influence{flex:1;height:6px;background:var(--border);border-radius:3px;position:relative}
.faction-bar .f-influence-fill{height:100%;border-radius:3px;transition:width .5s}
.faction-bar .f-value{font-size:.75rem;color:var(--muted2);min-width:50px;text-align:right}

.timeline-entry{display:flex;gap:16px;margin-bottom:20px;position:relative}
.timeline-entry::before{content:'';position:absolute;left:15px;top:24px;bottom:-20px;width:1px;background:var(--border)}
.timeline-entry:last-child::before{display:none}
.tl-dot{width:30px;height:30px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;color:var(--accent);z-index:1}
.tl-body{flex:1;padding-top:4px}
.tl-year{font-size:.72rem;color:var(--muted2);letter-spacing:.1em}
.tl-title{font-size:.92rem;color:var(--text);margin:2px 0}
.tl-desc{font-size:.78rem;color:var(--muted2);line-height:1.5}

.ending-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;border-top:3px solid}
.ending-card h3{font-size:1rem;margin-bottom:6px}
.ending-card .ending-req{font-size:.72rem;color:var(--muted2);margin-bottom:10px;letter-spacing:.05em}
.ending-card p{font-size:.82rem;line-height:1.6;color:var(--muted2)}

.breadcrumb{font-size:.72rem;color:var(--muted);margin-bottom:12px;letter-spacing:.05em}
.breadcrumb span{color:var(--muted2);cursor:pointer}
.breadcrumb span:hover{color:var(--accent)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.two-col,.info-grid{grid-template-columns:1fr}}

.home-hero{text-align:center;padding:40px 0 32px;border-bottom:1px solid var(--border);margin-bottom:32px}
.home-hero h1{font-size:2.4rem;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.home-hero .hero-sub{color:var(--muted2);font-size:.9rem;letter-spacing:.15em;margin-bottom:20px}
.home-hero .hero-desc{max-width:600px;margin:0 auto;font-size:.88rem;line-height:1.8;color:var(--text)}

.quick-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.ql-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted2);padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.78rem;font-family:inherit;transition:all .2s}
.ql-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}

.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
@media(max-width:800px){.home-grid{grid-template-columns:1fr 1fr}}
.home-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.home-card .hc-icon{font-size:1.6rem;margin-bottom:10px}
.home-card h3{font-size:.9rem;margin-bottom:4px;color:var(--accent)}
.home-card p{font-size:.75rem;color:var(--muted2);line-height:1.5}

.secret-tier{margin-bottom:20px}
.secret-tier h3{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.secret-item{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:8px}
.secret-item .s-id{font-size:.65rem;color:var(--muted);letter-spacing:.1em}
.secret-item .s-name{font-size:.85rem;color:var(--text);margin:2px 0}
.secret-item .s-location{font-size:.72rem;color:var(--muted2)}

.artifact-class-I{border-left:3px solid #7ec87e}
.artifact-class-II{border-left:3px solid #d4b84a}
.artifact-class-III{border-left:3px solid #c8833a}
.artifact-class-IV{border-left:3px solid #9b5ccc}
.artifact-class-V{border-left:3px solid #9b2f2f}
.artifact-class-O{border-left:3px solid #4a90d4}

.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px}

.meta-warning{background:rgba(155,47,47,.06);border:1px solid rgba(155,47,47,.2);border-radius:6px;padding:16px;margin-bottom:20px;font-size:.82rem;line-height:1.6}
.meta-warning .mw-label{color:#d07070;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}

.connection-line{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.82rem}
.connection-line .cl-name{color:var(--text);min-width:160px}
.connection-line .cl-arrow{color:var(--muted);font-size:.9rem}
.connection-line .cl-type{color:var(--accent);font-size:.75rem}
.connection-line .cl-desc{color:var(--muted2);font-size:.72rem}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted2)}
.empty-state .es-icon{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:.9rem;margin-bottom:6px;color:var(--muted)}
.empty-state p{font-size:.78rem}

/* PROPHECY MODAL */
.prophecy-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.prophecy-modal-overlay.open{opacity:1;pointer-events:all}
.prophecy-modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;max-width:480px;width:90%;position:relative;overflow:hidden;transform:translateY(20px);transition:transform .3s}
.prophecy-modal-overlay.open .prophecy-modal{transform:translateY(0)}
.prophecy-modal-top{background:linear-gradient(135deg,rgba(200,131,58,.15),rgba(122,79,196,.1));border-bottom:1px solid var(--border);padding:20px 24px 16px;text-align:center}
.prophecy-modal-top .liber-title{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.prophecy-modal-top .entry-id{font-size:2rem;color:var(--accent);font-weight:bold;line-height:1}
.prophecy-modal-body{padding:24px;text-align:center}
.prophecy-modal-body .entry-text{font-size:1.05rem;line-height:1.8;color:var(--text);font-style:italic;white-space:pre-line;margin-bottom:20px;min-height:60px}
.prophecy-modal-body .entry-status{display:inline-block;font-size:.65rem;letter-spacing:.2em;padding:3px 14px;border-radius:12px;border:1px solid;margin-bottom:20px}
.status-правда{color:#7ec87e;border-color:rgba(126,200,126,.4);background:rgba(126,200,126,.1)}
.status-ложь{color:#d07070;border-color:rgba(208,112,112,.4);background:rgba(208,112,112,.1)}
.status-полуправда{color:#d4b84a;border-color:rgba(212,184,74,.4);background:rgba(212,184,74,.1)}
.status-hidden{color:var(--muted2);border-color:var(--border);background:var(--bg)}
.prophecy-modal-body .entry-section{font-size:.68rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
.prophecy-modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-prophecy{padding:8px 20px;border-radius:4px;border:1px solid;font-family:inherit;font-size:.8rem;cursor:pointer;transition:all .2s;letter-spacing:.06em}
.btn-again{background:var(--glow);border-color:var(--accent);color:var(--accent)}
.btn-again:hover{background:rgba(200,131,58,.2)}
.btn-close-modal{background:transparent;border-color:var(--border);color:var(--muted2)}
.btn-close-modal:hover{border-color:var(--muted);color:var(--text)}
.prophecy-hint{font-size:.65rem;color:var(--muted);margin-top:14px;text-align:center;font-style:italic}

/* PROPHECY PAGE */
.proph-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.proph-filter-btn{padding:5px 14px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .18s;letter-spacing:.06em}
.proph-filter-btn:hover{border-color:var(--accent);color:var(--text)}
.proph-filter-btn.active{background:var(--glow);border-color:var(--accent);color:var(--accent)}
.proph-filter-btn.f-правда.active{background:rgba(126,200,126,.1);border-color:rgba(126,200,126,.5);color:#7ec87e}
.proph-filter-btn.f-ложь.active{background:rgba(208,112,112,.1);border-color:rgba(208,112,112,.5);color:#d07070}
.proph-filter-btn.f-полуправда.active{background:rgba(212,184,74,.1);border-color:rgba(212,184,74,.5);color:#d4b84a}
.proph-section-header{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.proph-section-toggle{font-size:.68rem;cursor:pointer;color:var(--accent);border:1px solid rgba(200,131,58,.4);border-radius:3px;padding:1px 8px;background:transparent;transition:all .15s}
.proph-section-toggle:hover{background:var(--glow)}
.proph-entry{display:flex;gap:0;margin-bottom:6px;align-items:stretch;border-radius:5px;overflow:hidden;border:1px solid var(--border);transition:border-color .15s}
.proph-entry:hover{border-color:var(--muted2)}
.proph-entry.disabled-entry{opacity:.4}
.proph-entry-check{display:flex;align-items:center;padding:0 12px;background:var(--bg);border-right:1px solid var(--border);cursor:pointer;min-width:40px;justify-content:center}
.proph-entry-check input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.proph-entry-body{flex:1;padding:10px 14px;background:var(--panel);font-size:.82rem;line-height:1.5;cursor:pointer;display:flex;gap:12px;align-items:center}
.proph-entry-body:hover{background:rgba(255,255,255,.02)}
.proph-id{font-size:.68rem;color:var(--muted);min-width:36px;letter-spacing:.05em}
.proph-text{flex:1;color:var(--text)}
.proph-status-badge{font-size:.6rem;letter-spacing:.12em;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap}
.proph-reveal-status{background:var(--bg);cursor:pointer;min-width:60px}
.proph-reveal-status:hover .proph-status-badge.status-hidden{border-color:var(--accent)}
.bulk-controls{display:flex;gap:6px;flex-wrap:wrap}

function searchIndex(q) {
  if(!q||q.length<2) return [];
  const lq = q.toLowerCase();
  return SEARCH_INDEX.filter(i => i.keywords.toLowerCase().includes(lq)).slice(0,8);
}

// Prophecy state (enabled/disabled)
function getProphState() {
  try { return JSON.parse(localStorage.getItem('vatra_proph_enabled') || 'null') || {}; }
  catch(e) { return {}; }
}
function setProphState(state) {
  try { localStorage.setItem('vatra_proph_enabled', JSON.stringify(state)); } catch(e) {}
}
function isProphEnabled(id) {
  const state = getProphState();
  return state[id] !== false; // enabled by default
}
function toggleProph(id, enabled) {
  const state = getProphState();
  state[id] = enabled;
  setProphState(state);
}
function getActiveProphecies(filterStatus) {
  return PROPHECIES.filter(p => {
    if (!isProphEnabled(p.id)) return false;
    if (filterStatus && p.status !== filterStatus) return false;
    return true;
  });
}
function getRandomProphecy(filterStatus) {
  const pool = getActiveProphecies(filterStatus);
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================================
// ITEMS CATALOG — глобальное состояние и функции
// (должны быть в глобальной области, не в innerHTML-шаблоне)
// ============================================================
let _ic = { items:[], rarC:{}, rarL:{}, catL:{}, srcL:{}, sort:{col:'name',dir:1} };

function filterItems(){
  if(!_ic.items.length) return;
  const q   = (document.getElementById('itemSearch')?.value||'').toLowerCase();
  const cat = document.getElementById('itemCat')?.value||'';
  const rar = document.getElementById('itemRarity')?.value||'';
  const src = document.getElementById('itemSource')?.value||'';
  let res = _ic.items.filter(i=>{
    if(cat && i.cat!==cat) return false;
    if(rar && i.rarity!==rar) return false;
    if(src && !i.source.includes(src)) return false;
    if(q && !(i.name+(i.desc||'')+(i.sub||'')+(i.loc||'')).toLowerCase().includes(q)) return false;
    return true;
  });
  res.sort((a,b)=>{
    const av=a[_ic.sort.col]||''; const bv=b[_ic.sort.col]||'';
    return (av<bv?-1:av>bv?1:0)*_ic.sort.dir;
  });
  renderItemsTable(res);
}

function sortItems(col){
  if(_ic.sort.col===col) _ic.sort.dir*=-1; else {_ic.sort.col=col;_ic.sort.dir=1;}
  filterItems();
}

function renderItemsTable(rows){
  const tb = document.getElementById('itemsTable');
  if(!tb) return;
  Array.from(tb.rows).slice(1).forEach(r=>r.remove());
  rows.forEach((item,idx)=>{
    const tr = document.createElement('tr');
    tr.style.cursor='pointer';
    tr.onclick=()=>showItemDetail(item);
    const bufHtml = [
      ...item.buffs.map(b=>`<span style="color:#7ec87e;font-size:.7rem">⬆ ${b}</span>`),
      ...item.debuffs.map(d=>`<span style="color:#d07070;font-size:.7rem">⬇ ${d}</span>`)
    ].join('<br>') || '<span style="color:var(--muted);font-size:.7rem">—</span>';
    const srcHtml = item.source.map(s=>_ic.srcL[s]||s).join(' ');
    const rc = _ic.rarC[item.rarity]||'#888';
    tr.innerHTML = `
      <td style="color:var(--muted);font-size:.7rem">${idx+1}</td>
      <td><span style="color:var(--accent)">${item.name}</span><div style="font-size:.7rem;color:var(--muted2)">${item.sub||''}</div></td>
      <td style="font-size:.72rem;color:var(--muted2)">${_ic.catL[item.cat]||item.cat}</td>
      <td><span style="font-size:.68rem;padding:1px 8px;border-radius:10px;color:${rc};border:1px solid ${rc}40;background:${rc}10">${_ic.rarL[item.rarity]||item.rarity}</span></td>
      <td style="font-size:.72rem;color:var(--muted2)">${srcHtml}</td>
      <td style="font-size:.72rem"><div style="color:var(--accent)">${item.price||'—'}</div><div style="color:var(--muted2)">${item.loc||''}</div></td>
      <td>${bufHtml}</td>
    `;
    tb.appendChild(tr);
  });
  const ctr = document.getElementById('itemCounter');
  if(ctr) ctr.textContent = rows.length + ' из ' + _ic.items.length;
}

function pageSpells() {
  const typeConfig = {
    buff:     {label:'БАФ',     color:'#7ec87e', bg:'rgba(126,200,126,.12)'},
    debuff:   {label:'ДЕБАФ',   color:'#d07070', bg:'rgba(208,112,112,.12)'},

    healing:  {label:'ЛЕЧЕНИЕ', color:'#4a90d4', bg:'rgba(74,144,212,.12)'},
    utility:  {label:'УТИЛИТА', color:'#9b5ccc', bg:'rgba(155,92,204,.12)'},
    forbidden:{label:'ЗАПРЕЩЕНО',color:'#d07070', bg:'rgba(155,47,47,.15)'},
  };
  const yearLabel = i => i<2?'I':i<4?'II':i<6?'III':i<8?'IV':i<10?'V':i<12?'VI':i<14?'VII':i<16?'M':'⚠';
  const yearColor = i => i>=16?'#d07070':i>=14?'#c8833a':'var(--muted2)';
  const schools = TEACHERS.map(t=>({teacher:t.name, subject:t.subject, spells:t.spells, avatar:t.avatar, id:t.id}));
  return `
  <div class="page-header">
    <span class="page-tag tag-magic">МАГИЯ</span>
    <h1>Гримуары 12 Школ Магии</h1>
    <div class="page-meta">216 заклинаний · 24 запретных работы · Полные RPG-механики</div>
  </div>
  <div class="tabs" style="flex-wrap:wrap">
    ${schools.map((s,i)=>
      `<div class="tab${i===0?' active':''}" data-group="spellbook" data-tab="${s.id}"
        onclick="switchTab('spellbook','${s.id}')" title="${s.subject}"
        style="font-size:1.1rem;padding:8px 12px">${s.avatar}</div>`
    ).join('')}
  </div>
  ${schools.map((s,i)=>{
    const intro = GRIMOIRE_INTRO[s.id]||'';
    const spellCards = s.spells.map((sp,idx)=>{
      const raw = sp.replace(' ⚠','');
      const isForbid = sp.includes('⚠');
      const yr = yearLabel(idx);
      const yc = yearColor(idx);
      const det = SPELL_DETAILS[s.id]?.[raw]||{};
      const mech = GRIMOIRE_MECHANICS[raw]||{};
      const typeKey = mech.type||det.type||( isForbid?'forbidden':'utility');
      const tc = typeConfig[typeKey]||typeConfig.utility;
      return `
      <div style="background:var(--panel);border:1px solid var(--border);border-left:3px solid ${tc.color};border-radius:5px;padding:13px 15px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px">
          <div>
            <span style="color:${isForbid?'#d07070':'var(--accent)'};font-size:.92rem;font-weight:bold">${raw}</span>
            ${mech.dice&&mech.dice!=='—'?`<span style="font-size:.68rem;color:${tc.color};background:${tc.bg};padding:1px 7px;border-radius:3px;margin-left:6px">${mech.dice}</span>`:''}
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
            <span style="font-size:.62rem;padding:1px 7px;border-radius:10px;color:${yc};border:1px solid ${yc}40;background:${yc}10">Год ${yr}</span>
            <span style="font-size:.62rem;padding:1px 7px;border-radius:10px;color:${tc.color};border:1px solid ${tc.color}40;background:${tc.bg}">${tc.label}</span>
          </div>
        </div>
        ${det.desc?`<div style="font-size:.78rem;color:var(--muted2);line-height:1.5;margin-bottom:6px">${det.desc}</div>`:''}
        ${mech.mechanic?`<div style="font-size:.8rem;color:var(--text);line-height:1.5;margin-bottom:4px">⚙ ${mech.mechanic}</div>`:''}
        ${(det.target&&det.target!=='—')||(det.caster&&det.caster!=='—')?`
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          ${det.target&&det.target!=='—'?`<span style="font-size:.72rem;color:${det.target.startsWith('⬆')?'#7ec87e':'#d07070'}">${det.target}</span>`:''}
          ${det.caster&&det.caster!=='—'?`<span style="font-size:.72rem;color:#d07070">${det.caster}</span>`:''}
        </div>`:''}
        ${mech.cost&&mech.cost!=='—'?`<div style="font-size:.74rem;color:#d07070;margin-top:5px;font-style:italic">💸 Цена активации: ${mech.cost}</div>`:''}
      </div>`;
    }).join('');
    return `
    <div class="tab-content${i===0?' active':''}" data-group="spellbook" data-tab="${s.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
        <div>
          <div style="color:var(--accent);font-size:1.1rem;margin-bottom:4px">${s.avatar} ${s.subject}</div>
          <div style="font-size:.78rem;color:var(--muted2)">Преподаватель: <span onclick="navigate('teacher','${s.id}')" style="cursor:pointer;color:var(--accent2);border-bottom:1px dotted var(--accent2)">${s.teacher}</span></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${Object.entries(typeConfig).map(([k,v])=>{
            const count = s.spells.filter(sp=>{
              const raw=sp.replace(' ⚠','');
              const det=SPELL_DETAILS[s.id]?.[raw]||{};
              const mech=GRIMOIRE_MECHANICS[raw]||{};
              return (mech.type||det.type||(sp.includes('⚠')?'forbidden':'utility'))===k;
            }).length;
            return count>0?`<span style="font-size:.65rem;padding:2px 8px;border-radius:10px;color:${v.color};border:1px solid ${v.color}40;background:${v.bg}">${v.label} ×${count}</span>`:'';
          }).join('')}
        </div>
      </div>
      ${intro?`<div class="quote-block" style="margin-bottom:16px">${intro}</div>`:''}
      ${spellCards}
    </div>`;
  }).join('')}`;
}

function pageItems() {
  const catLabels = {artifact:'⚗️ Артефакт',ingredient:'🌿 Ингредиент',potion:'⚗️ Зелье / Яд',food:'🍞 Еда / Напиток',gadget:'⚙️ Гаджет',equipment:'🎒 Снаряжение',book:'📖 Книга / Инфо',personal:'💎 Личный предмет',currency:'💰 Валюта'};
  const rarityColors = {common:'#7a7490',uncommon:'#7ec87e',rare:'#4a90d4',epic:'#9b5ccc',legendary:'#c8833a',omega:'#4a90d4'};
  const rarityLabels = {common:'Обычный',uncommon:'Необычный',rare:'Редкий',epic:'Эпический',legendary:'Легендарный',omega:'Ω-Класс'};
  const sourceLabel = {buy:'🛒 Купить',find:'🔍 Найти',drop:'⚔️ Дроп',quest:'📋 Квест',craft:'🔧 Крафт',event:'💥 Событие'};

  const cats = Object.keys(catLabels);
  const rarities = ['common','uncommon','rare','epic','legendary','omega'];

  // merge with ARTIFACTS_DATA
  const allArtifacts = ARTIFACTS_DATA.map(a => {
    const ext = ARTIFACTS_EXTENDED[a.id] || {};
    return {
      id: a.id, name: a.name, cat:'artifact', sub: a.cat,
      rarity: a.cls==='O'?'omega':a.cls==='V'?'legendary':a.cls==='IV'?'epic':a.cls==='III'?'rare':a.cls==='II'?'uncommon':'common',
      source: ext.activation ? ['find','quest'] : ['find'],
      price: '—',
      loc: a.loc || (ext.era ? `Эпоха: ${ext.era}` : 'Хранилище'),
      buffs: ext.buffs || [],
      debuffs: ext.debuffs || (a.danger ? [a.danger] : []),
      desc: a.desc + (ext.activation ? ` Активация: ${ext.activation}.` : ''),
    };
  });

  const allItems = [...allArtifacts, ...ITEMS_CATALOG];

  // Заполняем глобальное состояние для filterItems() и co.
  _ic.items = allItems;
  _ic.rarC  = rarityColors;
  _ic.rarL  = rarityLabels;
  _ic.catL  = catLabels;
  _ic.srcL  = sourceLabel;
  _ic.sort  = {col:'name',dir:1};

  return `
  <div class="page-header">
    <span class="page-tag tag-world">ПРЕДМЕТЫ</span>
    <h1>📦 Каталог Предметов Ватры</h1>
    <div class="page-meta">${allItems.length} предметов · Артефакты · Ингредиенты · Зелья · Еда · Снаряжение · Личные вещи</div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center">
    <div style="position:relative;flex:1;min-width:220px">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)">⌕</span>
      <input id="itemSearch" placeholder="Поиск по названию, описанию..." oninput="filterItems()"
        style="width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 12px 7px 30px;border-radius:4px;font-family:inherit;font-size:.82rem;outline:none"/>
    </div>
    <select id="itemCat" onchange="filterItems()" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:4px;font-family:inherit;font-size:.82rem;outline:none">
      <option value="">Все категории</option>
      ${cats.map(c=>`<option value="${c}">${catLabels[c]}</option>`).join('')}
    </select>
    <select id="itemRarity" onchange="filterItems()" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:4px;font-family:inherit;font-size:.82rem;outline:none">
      <option value="">Любая редкость</option>
      ${rarities.map(r=>`<option value="${r}" style="color:${rarityColors[r]}">${rarityLabels[r]}</option>`).join('')}
    </select>
    <select id="itemSource" onchange="filterItems()" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:4px;font-family:inherit;font-size:.82rem;outline:none">
      <option value="">Любой источник</option>
      ${Object.entries(sourceLabel).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
    </select>
    <span id="itemCounter" style="font-size:.75rem;color:var(--muted2);white-space:nowrap"></span>
  </div>

  <div style="overflow-x:auto">
    <table id="itemsTable" style="font-size:.78rem">
      <tr>
        <th style="width:36px">#</th>
        <th onclick="sortItems('name')" style="cursor:pointer">Название ↕</th>

// ─── PROPHECIES ─────────────────────────────────────────────
function prophStatusBadge(p, reveal) {
  if (!reveal) return `<span class="proph-status-badge status-hidden" title="Статус скрыт">[???]</span>`;
  const cls = 'status-'+p.status.toLowerCase();
  return `<span class="proph-status-badge ${cls}">[${p.status}]</span>`;
}

function renderProphSection(secId, entries, revealAll) {
  const sec = PROPHECIES_SECTIONS.find(s=>s.id===secId);
  if (!entries.length) return '';
  const enabledCount = entries.filter(p=>isProphEnabled(p.id)).length;
  return `
  <div class="proph-section-header">
    <span>${sec?sec.icon+' '+sec.label:secId} <span style="color:var(--muted);font-weight:normal">(${enabledCount}/${entries.length})</span></span>
    <div style="display:flex;gap:6px">
      <button class="proph-section-toggle" onclick="toggleSection_proph('${secId}',true)">Все ✓</button>
      <button class="proph-section-toggle" onclick="toggleSection_proph('${secId}',false)">Все ✗</button>
    </div>
  </div>
  ${entries.map(p=>{
    const enabled = isProphEnabled(p.id);
    return `<div class="proph-entry ${enabled?'':'disabled-entry'}" id="proph-row-${p.id}">
      <label class="proph-entry-check" title="${enabled?'Отключить':'Включить'} эту запись">
        <input type="checkbox" ${enabled?'checked':''} onchange="toggleProphEntry('${p.id}',this.checked)">
      </label>
      <div class="proph-entry-body" onclick="toggleRevealStatus('prophbadge-${p.id}')">
        <span class="proph-id">${p.id}</span>
        <span class="proph-text">${p.text.replace(/\n/g,' ')}</span>
        ${p.effect?`<span style="font-size:.65rem;color:var(--accent2);white-space:nowrap">${p.effect}</span>`:''}
        <span class="proph-status-badge status-hidden proph-reveal-status" id="prophbadge-${p.id}" data-status="${p.status}" data-revealed="${revealAll?'1':'0'}"
          title="Нажмите чтобы раскрыть статус">${revealAll?'['+p.status+']':'[???]'}</span>
      </div>
    </div>`;
  }).join('')}`;
}

function toggleRevealStatus(badgeId) {
  const el = document.getElementById(badgeId);
  if (!el) return;
  if (el.dataset.revealed === '1') {
    el.textContent = '[???]';
    el.className = 'proph-status-badge status-hidden proph-reveal-status';
    el.dataset.revealed = '0';
  } else {
    const st = el.dataset.status || '';
    el.textContent = '['+st+']';
    el.className = 'proph-status-badge status-'+st.toLowerCase()+' proph-reveal-status';
    el.dataset.revealed = '1';
  }
}

function toggleProphEntry(id, enabled) {
  toggleProph(id, enabled);
  const row = document.getElementById('proph-row-'+id);
  if (row) row.classList.toggle('disabled-entry', !enabled);
  updateProphCounter();
}

function toggleSection_proph(secId, enabled) {
  PROPHECIES.filter(p=>p.section===secId).forEach(p=>{
    toggleProph(p.id, enabled);
    const row = document.getElementById('proph-row-'+p.id);
    if (row) row.classList.toggle('disabled-entry', !enabled);
    const cb = row?.querySelector('input[type=checkbox]');
    if (cb) cb.checked = enabled;
  });
  updateProphCounter();
}

function toggleAll_proph(enabled) {
  PROPHECIES.forEach(p=>{
    toggleProph(p.id, enabled);
    const row = document.getElementById('proph-row-'+p.id);
    if (row) row.classList.toggle('disabled-entry', !enabled);
    const cb = row?.querySelector('input[type=checkbox]');
    if (cb) cb.checked = enabled;
  });
  updateProphCounter();
}

let prophRevealAll = false;
function toggleRevealAll() {
  prophRevealAll = !prophRevealAll;
  document.querySelectorAll('[id^="prophbadge-"]').forEach(el=>{
    const st = el.dataset.status || '';
    if (prophRevealAll) {
      el.textContent = '['+st+']';
      el.className = 'proph-status-badge status-'+st.toLowerCase()+' proph-reveal-status';
      el.dataset.revealed = '1';
    } else {
      el.textContent = '[???]';
      el.className = 'proph-status-badge status-hidden proph-reveal-status';
      el.dataset.revealed = '0';
    }
  });
  const btn = document.getElementById('revealAllBtn');
  if (btn) btn.textContent = prophRevealAll ? '🙈 Скрыть статусы' : '👁 Показать статусы';
}

let prophStatusFilter = null;
function setProphFilter(status) {
  prophStatusFilter = status;
  document.querySelectorAll('.proph-filter-btn').forEach(b=>b.classList.remove('active'));
  const active = document.querySelector('.proph-filter-btn[data-flt="'+(status||'all')+'"]');
  if (active) active.classList.add('active');
  renderProphList();
}

function updateProphCounter() {
  const total = PROPHECIES.length;
  const active = PROPHECIES.filter(p=>isProphEnabled(p.id)).length;
  const el = document.getElementById('prophCounter');
  if (el) el.textContent = active+' / '+total+' активно';
}

function renderProphList() {
  const container = document.getElementById('prophList');
  if (!container) return;
  const filtered = prophStatusFilter
    ? PROPHECIES.filter(p=>p.status===prophStatusFilter)
    : PROPHECIES;
  const bySection = {};
  filtered.forEach(p=>{ (bySection[p.section]||(bySection[p.section]=[])).push(p); });
  container.innerHTML = PROPHECIES_SECTIONS
    .filter(s=>bySection[s.id]?.length)
    .map(s=>renderProphSection(s.id, bySection[s.id]||[], prophRevealAll))
    .join('');
  updateProphCounter();
}

  <div class="quote-block">«Книга не сообщает статус. Она просто даёт запись. Что с ней делать — решаешь ты.»</div>

      <button class="btn-get-prophecy" style="border-color:#d07070;color:#d07070;background:rgba(208,112,112,.08)" onclick="openProphecyModal('ЛОЖЬ')">✗ Только ЛОЖЬ</button>
    </div>

    <button class="btn-bulk" id="revealAllBtn" onclick="toggleRevealAll()">👁 Показать статусы</button>
    <span class="proph-counter" id="prophCounter"></span>
  </div>

  <div id="prophList"></div>
  `;
}
